<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
<style>
.bg{fill:#f6f9ff}.phone{fill:#111827}.screen{fill:#f8fafc}.bar{fill:#1683ff}.card{fill:#fff;stroke:#dbeafe;stroke-width:2}.title{font:700 22px Arial;fill:#0f172a}.small{font:500 15px Arial;fill:#64748b}.white{font:700 18px Arial;fill:#fff}.pill{fill:#eef2ff;stroke:#c4b5fd}.pill2{fill:#ecfeff;stroke:#99f6e4}.pt{font:700 17px Arial;fill:#6d28d9}.pt2{font:700 17px Arial;fill:#0f766e}.line{stroke:#8b5cf6;stroke-width:3;stroke-dasharray:7 7;fill:none}.line2{stroke:#14b8a6;stroke-width:3;stroke-dasharray:7 7;fill:none}.fab{fill:#2563eb}.icon{font:700 24px Arial;fill:#fff}
</style>
<rect width="900" height="560" rx="36" class="bg"/>
