<rect x="54" y="286" width="176" height="56" rx="18" class="pill"/><text x="107" y="320" class="label" fill="#be185d">Dialog</text><path d="M230 314H348" stroke="#ec4899" class="line"/>
<rect x="650" y="420" width="176" height="56" rx="18" class="pill3"/><text x="697" y="454" class="label" fill="#2563eb">SnackBar</text><path d="M650 448H574" stroke="#2563eb" class="line"/>
<rect x="646" y="486" width="180" height="56" rx="18" class="pill2"/><text x="672" y="520" class="label" fill="#0f766e">BottomSheet</text><path d="M646 514H574" stroke="#14b8a6" class="line"/>
