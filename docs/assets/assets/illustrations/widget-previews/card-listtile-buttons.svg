<style>.bg{fill:#f7fbff}.phone{fill:#111827}.screen{fill:#f8fafc}.bar{fill:#2563eb}.card{fill:#fff;stroke:#dbeafe;stroke-width:2}.tile{fill:#fff;stroke:#e2e8f0;stroke-width:2}.title{font:700 22px Arial;fill:#0f172a}.small{font:500 14px Arial;fill:#64748b}.white{font:700 18px Arial;fill:#fff}.btn{fill:#2563eb}.outline{fill:#fff;stroke:#2563eb;stroke-width:2}.label{font:700 17px Arial}.pill{fill:#ede9fe}.pill2{fill:#ccfbf1}.pill3{fill:#dbeafe}.line{stroke-width:3;stroke-dasharray:7 7;fill:none}</style>
