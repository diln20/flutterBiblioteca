<rect x="650" y="300" width="174" height="56" rx="18" class="pill2"/><text x="696" y="334" class="label" fill="#2563eb">Future</text><path d="M650 328H566" stroke="#2563eb" class="line"/>
<rect x="650" y="394" width="174" height="56" rx="18" class="pill3"/><text x="675" y="428" class="label" fill="#7c3aed">Persistencia</text><path d="M650 422H566" stroke="#8b5cf6" class="line"/>
